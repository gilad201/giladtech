apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: llm-app
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - giladtech.io
    - "*.giladtech.io"
    secretName: cloudflare-origin-cert  # Use the secret created by Terraform

  ingressClassName: nginx
  rules:
    - host: llm-app.giladtech.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-app-service
                port:
                  number: 80