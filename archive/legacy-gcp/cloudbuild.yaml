substitutions:
  _VERSION: "1.2.9"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "$$DOCKER_PASSWORD" | docker login -u "$$DOCKER_USERNAME" --password-stdin
    secretEnv: ['DOCKER_USERNAME', 'DOCKER_PASSWORD']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'docker.io/giladtech/python-api:${_VERSION}', './services/python-api']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'docker.io/giladtech/python-api:${_VERSION}']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/docker-hub-username/versions/latest
      env: DOCKER_USERNAME
    - versionName: projects/$PROJECT_ID/secrets/docker-hub-password/versions/latest
      env: DOCKER_PASSWORD

